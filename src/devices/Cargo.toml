[package]
name = "devices"
version = "0.1.0"
authors = ["rust-vmm AWS maintainers <rust-vmm-maintainers@amazon.com>"]
edition = "2018"
license = "Apache-2.0 OR BSD-3-Clause"

[dependencies]
event-manager = { version = "0.4.0", features = ["remote_endpoint"] }
kvm-ioctls = { git = "https://github.com/rust-vmm/kvm.git", version = "0.20.0"}
libc = "0.2.76"
linux-loader = "0.13.0"
log = "*"
vm-memory = "0.16.0"
vm-superio = "0.8.0"
vmm-sys-util = "0.12.1"
vm-device = "0.1.0"

thiserror = "1.0"
virtio-blk = { git = "https://github.com/rust-vmm/vm-virtio.git", version = "0.1.0", features = ["backend-stdio"] }
virtio-device = { git = "https://github.com/rust-vmm/vm-virtio.git", version = "0.1.0"}
virtio-queue = { git = "https://github.com/rust-vmm/vm-virtio.git", version = "0.14.0"}

utils = { path = "../utils" }

[dev-dependencies]
vm-memory = { version = "0.16.0", features = ["backend-mmap"] }
kvm-bindings = { git = "https://github.com/rust-vmm/kvm.git", version = "0.11.0"}

[package]
name = "vm-vcpu"
version = "0.1.0"
authors = ["rust-vmm AWS maintainers <rust-vmm-maintainers@amazon.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0.30"
libc = "0.2.76"
kvm-bindings = { git = "https://github.com/rust-vmm/kvm.git", version = "0.11.0", features = ["fam-wrappers"] }
kvm-ioctls = { git = "https://github.com/rust-vmm/kvm.git", version = "0.20.0"}
vm-memory = "0.16.0"
vmm-sys-util = "0.12.1"
vm-device = "0.1.0"

utils = { path = "../utils" }
vm-vcpu-ref = { path = "../vm-vcpu-ref" }
arch = { path = "../arch" }

[dev-dependencies]
vm-memory = { version = "0.16.0", features = ["backend-mmap"] }
